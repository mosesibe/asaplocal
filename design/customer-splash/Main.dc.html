<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap">
  <style>
    body { margin: 0; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    a { color: #e6975d; } a:hover { color: #f0bd91; }

    .stage {
      position: relative; width: 390px; height: 844px; overflow: hidden;
      background: hsl(20 35% 7%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      animation: handoff 5s cubic-bezier(.4,0,.2,1) infinite;
    }
    /* The whole splash lifts and dims at the end — the hand-off to dashboard. */
    @keyframes handoff {
      0%, 90% { opacity: 1; transform: scale(1); }
      98%, 100% { opacity: 0; transform: scale(1.04); }
    }

    /* Warm bloom behind everything, echoing the mark's terracotta. */
    .glow {
      position: absolute; left: 50%; top: 44%; width: 620px; height: 620px;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(193,95,42,.28) 0%, rgba(193,95,42,.10) 38%, rgba(193,95,42,0) 68%);
      animation: bloom 5s ease-in-out infinite;
    }
    @keyframes bloom {
      0% { opacity: 0; transform: translate(-50%,-50%) scale(.75); }
      12% { opacity: .7; transform: translate(-50%,-50%) scale(1); }
      52% { opacity: .55; }
      62% { opacity: 1; transform: translate(-50%,-50%) scale(1.08); }
      100% { opacity: 1; transform: translate(-50%,-50%) scale(1.08); }
    }

    /* ---- Beat 1: the promise, with the trade cycling ---- */
    .promise {
      position: absolute; left: 0; right: 0; text-align: center; padding: 0 32px;
      animation: promiseOut 5s cubic-bezier(.4,0,.2,1) infinite;
    }
    @keyframes promiseOut {
      0% { opacity: 0; transform: translateY(14px); }
      10%, 46% { opacity: 1; transform: translateY(0); }
      56%, 100% { opacity: 0; transform: translateY(-18px); }
    }
    .promise-lead {
      margin: 0; font-size: 26px; line-height: 1.25; font-weight: 600;
      color: #f3eae3; letter-spacing: -.02em; text-wrap: balance;
    }
    .ticker { height: 46px; overflow: hidden; margin-top: 6px; }
    .ticker-col { animation: roll 5s cubic-bezier(.76,0,.24,1) infinite; }
    .ticker-word {
      height: 46px; display: flex; align-items: center; justify-content: center;
      font-size: 34px; font-weight: 800; letter-spacing: -.03em; color: #e6975d;
    }
    /* Five trades, then back to the first so the loop never jumps. */
    @keyframes roll {
      0%, 8%    { transform: translateY(0); }
      13%, 17%  { transform: translateY(-46px); }
      22%, 26%  { transform: translateY(-92px); }
      31%, 35%  { transform: translateY(-138px); }
      40%, 100% { transform: translateY(-184px); }
    }

    /* ---- Beat 2: the mark resolves ---- */
    .mark-wrap {
      position: absolute; display: flex; flex-direction: column; align-items: center;
      animation: markIn 5s cubic-bezier(.34,1.3,.42,1) infinite;
    }
    @keyframes markIn {
      0%, 52%  { opacity: 0; transform: scale(.72); }
      64%, 92% { opacity: 1; transform: scale(1); }
      100%     { opacity: 1; transform: scale(1); }
    }
    .mark-ring {
      position: absolute; top: 50%; left: 50%; width: 132px; height: 132px; margin: -66px 0 0 -66px;
      border-radius: 50%; border: 1.5px solid rgba(193,95,42,.55);
      animation: ripple 5s ease-out infinite;
    }
    .mark-ring.delay { animation-delay: .28s; }
    @keyframes ripple {
      0%, 56%  { opacity: 0; transform: scale(.6); }
      66%      { opacity: .85; }
      86%, 100%{ opacity: 0; transform: scale(1.9); }
    }
    .mark { width: 108px; height: 108px; display: block; position: relative; }
    .wordmark {
      margin: 22px 0 0; font-size: 30px; font-weight: 800; letter-spacing: -.03em;
      color: #f3eae3;
      animation: wordIn 5s ease-out infinite;
    }
    .wordmark span { color: #e6975d; }
    .tagline {
      margin: 8px 0 0; font-size: 14px; font-weight: 400; color: #a57f5f;
      letter-spacing: -.01em; text-align: center; text-wrap: balance;
      animation: wordIn 5s ease-out infinite;
    }
    @keyframes wordIn {
      0%, 62%  { opacity: 0; transform: translateY(8px); }
      74%, 92% { opacity: 1; transform: translateY(0); }
      100%     { opacity: 1; transform: translateY(0); }
    }

    /* Progress hairline — the only "loading" affordance; no spinner. */
    .bar {
      position: absolute; left: 50%; bottom: 96px; transform: translateX(-50%);
      width: 108px; height: 2px; border-radius: 2px; background: rgba(243,234,227,.12);
      overflow: hidden;
    }
    .bar-fill {
      display: block; height: 100%; width: 100%; border-radius: 2px;
      background: linear-gradient(90deg, #c15f2a, #e6975d);
      transform-origin: left center; animation: fill 5s cubic-bezier(.4,0,.2,1) infinite;
    }
    @keyframes fill {
      0%   { transform: scaleX(0); }
      88%, 100% { transform: scaleX(1); }
    }
  </style>
</helmet>

<div class="stage">
  <div class="glow"></div>

  <div class="promise">
    <p class="promise-lead">Find a trusted local</p>
    <div class="ticker">
      <div class="ticker-col">
        <div class="ticker-word">cleaner</div>
        <div class="ticker-word">plumber</div>
        <div class="ticker-word">electrician</div>
        <div class="ticker-word">gardener</div>
        <div class="ticker-word">cleaner</div>
      </div>
    </div>
  </div>

  <div class="mark-wrap">
    <div style="position: relative; display: flex; align-items: center; justify-content: center; width: 132px; height: 132px;">
      <div class="mark-ring"></div>
      <div class="mark-ring delay"></div>
      <img class="mark" src="logo-mark.svg" alt="AsapLocal">
    </div>
    <p class="wordmark">Asap<span>Local</span></p>
    <p class="tagline">Find trusted local service providers</p>
  </div>

  <div class="bar"><span class="bar-fill"></span></div>
</div>
</x-dc>
</body>
</html>
