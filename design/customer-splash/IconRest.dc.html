<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap">
  <style>
    body { margin: 0; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    a { color: #e6975d; } a:hover { color: #f0bd91; }
    .stage {
      position: relative; width: 390px; height: 844px; overflow: hidden;
      background: hsl(20 35% 7%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .glow {
      position: absolute; left: 50%; top: 44%; width: 620px; height: 620px; transform: translate(-50%,-50%);
      background: radial-gradient(circle, rgba(193,95,42,.28) 0%, rgba(193,95,42,.10) 38%, rgba(193,95,42,0) 68%);
    }
    .mark-wrap { position: relative; display: flex; flex-direction: column; align-items: center; }
    .mark { width: 108px; height: 108px; display: block; }
    .wordmark { margin: 22px 0 0; font-size: 30px; font-weight: 800; letter-spacing: -.03em; color: #f3eae3; }
    .wordmark span { color: #e6975d; }
    .tagline { margin: 8px 0 0; font-size: 14px; color: #a57f5f; text-align: center; text-wrap: balance; }
    .bar {
      position: absolute; left: 50%; bottom: 96px; transform: translateX(-50%);
      width: 108px; height: 2px; border-radius: 2px; background: rgba(243,234,227,.12); overflow: hidden;
    }
    .bar-fill {
      display: block; height: 100%; width: 100%; border-radius: 2px;
      background: linear-gradient(90deg, #c15f2a, #e6975d);
    }
  </style>
</helmet>
<div class="stage">
  <div class="glow"></div>
  <div class="mark-wrap">
    <img class="mark" src="logo-mark.svg" alt="AsapLocal">
    <p class="wordmark">Asap<span>Local</span></p>
    <p class="tagline">Find trusted local service providers</p>
  </div>
  <div class="bar"><span class="bar-fill"></span></div>
</div>
</x-dc>
</body>
</html>
