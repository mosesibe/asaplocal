<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <style>
    /* Same provider tokens as Main.dc.html - apps/provider/app/globals.css .dark */
    :root {
      --bg: hsl(222 47% 7%);
      --surface: hsl(222 40% 10%);
      --border: hsl(217 33% 20%);
      --fg: hsl(210 20% 98%);
      --muted-fg: hsl(215 20% 65%);
      --brand-500: #c15f2a;
      --brand-300: #e6975d;
    }
    body { margin: 0; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    a { color: var(--brand-300); } a:hover { color: #f0bd91; }

    .stage {
      position: relative; width: 390px; height: 844px; overflow: hidden;
      background: var(--bg);
    }
    .inner {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      animation: handoff 5s cubic-bezier(.4,0,.2,1) infinite;
    }
    @keyframes handoff {
      0%   { opacity: 0; transform: scale(1); }
      4%   { opacity: 1; transform: scale(1); }
      92%  { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(1.04); }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .promise, .panel { opacity: 0 !important; }
    }

    .glow {
      position: absolute; top: 50%; left: 50%; width: 460px; height: 460px;
      transform: translate(-50%,-50%);
      background: radial-gradient(circle, rgba(193,95,42,.22), rgba(193,95,42,0) 68%);
      animation: bloom 5s ease-in-out infinite;
    }
    @keyframes bloom {
      0%   { opacity: 0; transform: translate(-50%,-50%) scale(.75); }
      14%  { opacity: .65; transform: translate(-50%,-50%) scale(1); }
      56%  { opacity: .5; }
      70%  { opacity: 1; transform: translate(-50%,-50%) scale(1.08); }
      100% { opacity: 1; transform: translate(-50%,-50%) scale(1.08); }
    }

    .promise {
      position: absolute; top: 132px; left: 0; right: 0; padding: 0 32px; text-align: center;
      animation: promiseOut 5s cubic-bezier(.4,0,.2,1) infinite;
    }
    @keyframes promiseOut {
      0%, 4%    { opacity: 0; transform: translateY(14px); }
      12%, 54%  { opacity: 1; transform: translateY(0); }
      60%, 100% { opacity: 0; transform: translateY(-18px); }
    }
    .promise h1 {
      margin: 0; font-size: 27px; line-height: 1.24; font-weight: 600; letter-spacing: -.025em;
      color: var(--fg); text-wrap: balance;
    }
    .promise p { margin: 10px 0 0; font-size: 15px; color: var(--muted-fg); text-wrap: balance; }

    /* The earnings panel. The bars only ever grow and hold; the PANEL owns the
       exit, so the bars' animation-delays can never desync their departure. */
    .panel {
      position: absolute; top: 296px; left: 16px; right: 16px;
      border-radius: 20px; border: 1px solid var(--border); background: var(--surface);
      box-shadow: 0 1px 3px rgba(0,0,0,.35), 0 4px 10px rgba(0,0,0,.35);
      padding: 20px;
      animation: panelOut 5s cubic-bezier(.4,0,.2,1) infinite;
    }
    @keyframes panelOut {
      0%, 4%    { opacity: 0; transform: translateY(24px) scale(.97); }
      16%, 54%  { opacity: 1; transform: translateY(0) scale(1); }
      60%, 100% { opacity: 0; transform: translateY(-14px) scale(.98); }
    }

    .panel-label { margin: 0; font-size: 12px; line-height: 16px; color: var(--muted-fg); }
    .total {
      margin: 4px 0 0; font-size: 34px; line-height: 40px; font-weight: 700;
      letter-spacing: -.03em; color: var(--fg);
    }
    .total-sub { margin: 4px 0 0; font-size: 13px; color: var(--brand-300); }

    .chart {
      margin-top: 20px; height: 116px;
      display: flex; align-items: flex-end; justify-content: space-between; gap: 10px;
    }
    .col { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; height: 100%; }
    .col-bar {
      width: 100%; border-radius: 6px 6px 3px 3px;
      background: linear-gradient(180deg, var(--brand-300), var(--brand-500));
      transform-origin: bottom center;
      animation: grow 5s cubic-bezier(.34,1.14,.42,1) infinite;
      animation-fill-mode: backwards;
    }
    /* Without backwards fill each bar renders full-height during its delay,
       so the whole chart would flash in complete and then collapse. */
    .col:nth-child(1) .col-bar { height: 42%;  animation-delay: .20s; }
    .col:nth-child(2) .col-bar { height: 58%;  animation-delay: .32s; }
    .col:nth-child(3) .col-bar { height: 50%;  animation-delay: .44s; }
    .col:nth-child(4) .col-bar { height: 74%;  animation-delay: .56s; }
    .col:nth-child(5) .col-bar { height: 66%;  animation-delay: .68s; }
    .col:nth-child(6) .col-bar { height: 100%; animation-delay: .80s; }
    @keyframes grow {
      0%        { transform: scaleY(0); }
      10%, 100% { transform: scaleY(1); }
    }

    /* Labels lifted verbatim from apps/provider/app/earnings/page.tsx. The three
       figures reconcile: 980.00 paid out + 260.00 available = 1,240.00 earned. */
    .splits { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border); display: flex; gap: 12px; }
    .split { flex: 1; }
    .split-label { margin: 0; font-size: 11px; line-height: 15px; color: var(--muted-fg); }
    .split-value { margin: 3px 0 0; font-size: 16px; font-weight: 600; color: var(--fg); }
    .split-value.accent { color: var(--brand-300); }

    .mark-wrap {
      position: absolute; top: 318px; left: 0; right: 0;
      display: flex; flex-direction: column; align-items: center;
      animation: markIn 5s cubic-bezier(.34,1.3,.42,1) infinite;
    }
    @keyframes markIn {
      0%, 60%  { opacity: 0; transform: scale(.72); }
      70%, 92% { opacity: 1; transform: scale(1); }
      100%     { opacity: 1; transform: scale(1); }
    }
    .mark-rings { position: absolute; top: 0; width: 108px; height: 108px; }
    .mark-ring {
      position: absolute; inset: 0; border-radius: 50%; border: 1px solid rgba(193,95,42,.45);
      animation: ripple 5s ease-out infinite;
      animation-fill-mode: backwards;
    }
    .mark-ring.delay { animation-delay: .28s; }
    @keyframes ripple {
      0%, 60%   { opacity: 0; transform: scale(.6); }
      70%       { opacity: .85; }
      88%, 100% { opacity: 0; transform: scale(1.9); }
    }
    .mark { width: 108px; height: 108px; display: block; position: relative; }

    .lockup {
      margin: 22px 0 0; display: flex; align-items: baseline; gap: 8px;
      animation: wordIn 5s ease-out infinite;
    }
    .wordmark { margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -.03em; color: var(--fg); }
    .wordmark span { color: var(--brand-300); }
    .qualifier { font-size: 14px; font-weight: 400; color: var(--muted-fg); }
    .tagline {
      margin: 8px 0 0; font-size: 14px; color: var(--muted-fg); text-align: center; text-wrap: balance;
      animation: wordIn 5s ease-out infinite;
    }
    @keyframes wordIn {
      0%, 70%  { opacity: 0; transform: translateY(8px); }
      80%, 92% { opacity: 1; transform: translateY(0); }
      100%     { opacity: 1; transform: translateY(0); }
    }

    .bar {
      position: absolute; left: 50%; bottom: 96px; transform: translateX(-50%);
      width: 108px; height: 2px; border-radius: 2px; background: rgba(226,232,240,.14); overflow: hidden;
    }
    .bar-fill {
      display: block; height: 100%; width: 100%; border-radius: 2px;
      background: linear-gradient(90deg, var(--brand-500), var(--brand-300));
      transform-origin: left center; animation: fill 5s cubic-bezier(.4,0,.2,1) infinite;
    }
    @keyframes fill { 0% { transform: scaleX(0); } 88%, 100% { transform: scaleX(1); } }
  </style>
</helmet>

<div class="stage">
  <div class="inner">
    <div class="glow"></div>

    <div class="promise">
      <h1>Get paid, job by job</h1>
      <p>Commission out, payout in &mdash; every job accounted for.</p>
    </div>

    <div class="panel">
      <p class="panel-label">Earned (after commission)</p>
      <p class="total">&pound;1,240.00</p>
      <p class="total-sub">6 jobs completed this month</p>

      <div class="chart">
        <div class="col"><span class="col-bar"></span></div>
        <div class="col"><span class="col-bar"></span></div>
        <div class="col"><span class="col-bar"></span></div>
        <div class="col"><span class="col-bar"></span></div>
        <div class="col"><span class="col-bar"></span></div>
        <div class="col"><span class="col-bar"></span></div>
      </div>

      <div class="splits">
        <div class="split">
          <p class="split-label">Paid out</p>
          <p class="split-value">&pound;980.00</p>
        </div>
        <div class="split">
          <p class="split-label">Available</p>
          <p class="split-value accent">&pound;260.00</p>
        </div>
        <div class="split">
          <p class="split-label">Commission</p>
          <p class="split-value">10%</p>
        </div>
      </div>
    </div>

    <div class="mark-wrap">
      <div class="mark-rings">
        <div class="mark-ring"></div>
        <div class="mark-ring delay"></div>
      </div>
      <img class="mark" src="logo-mark.svg" alt="">
      <p class="lockup"><span class="wordmark">Asap<span>Local</span></span><span class="qualifier">Business</span></p>
      <p class="tagline">Win more local work</p>
    </div>

    <div class="bar"><span class="bar-fill"></span></div>
  </div>
</div>
</x-dc>
</body>
</html>
